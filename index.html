<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Space Command</title>
    <style>
        body { background-color: #0a0b10; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 40px 20px; }
        .space-container { background: linear-gradient(145deg, #131520, #1e2235); border: 2px solid #3b82f6; border-radius: 16px; padding: 30px; max-width: 550px; margin: 0 auto; box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2); }
        h2 { color: #3b82f6; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        .data-box { background-color: #0a0b10; border: 1px solid #2d3748; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: left; }
        .label { color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; font-weight: bold; }
        .value { font-size: 1.4rem; color: #f8fafc; font-family: monospace; font-weight: bold; margin-top: 5px; }
        .btn { background-color: #3b82f6; color: white; border: none; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 15px; }
        .btn:hover { background-color: #2563eb; box-shadow: 0 0 15px rgba(59,130,246,0.4); }
        .back-link { display: inline-block; margin-top: 25px; color: #3b82f6; text-decoration: none; }
        .status-dot { width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 8px; }
    </style>
</head>
<body>

    <div class="space-container">
        <h2>🛰️ ISS Space Mission Tracker</h2>
        <p>This panel uses live API calls to pull real-time space data directly from orbital tracking stations.</p>
        
        <!-- Live Station Coordinates API Box -->
        <div class="data-box">
            <div class="label"><span class="status-dot"></span>ISS Orbital Coordinates</div>
            <div class="value" id="iss-coords">Latitude: Fetching... <br>Longitude: Fetching...</div>
        </div>

        <!-- Astronauts in Space API Box -->
        <div class="data-box">
            <div class="label">👨‍🚀 Humans Currently in Orbit</div>
            <div class="value" id="astro-count">Loading cosmic crew count...</div>
        </div>

        <button class="btn" id="refreshBtn">📡 Ping Satellite API</button>
        
        <br>
        <!-- NOTE: Point this link back to your primary hub domain -->
        <a href="https://rameshgedupuri.space" class="back-link">« Return to Command Hub</a>
    </div>

    <script>
        const coordsDisplay = document.getElementById('iss-coords');
        const astroDisplay = document.getElementById('astro-count');
        const refreshBtn = document.getElementById('refreshBtn');

        async function fetchSpaceData() {
            coordsDisplay.innerHTML = "Pinging satellite data...";
            
            try {
                // 1. Fetch live coordinates of the space station
                const issResponse = await fetch('https://wheretheiss.at');
                const issData = await issResponse.json();
                
                const lat = issData.latitude.toFixed(4);
                const lon = issData.longitude.toFixed(4);
                coordsDisplay.innerHTML = `Latitude: ${lat}° <br>Longitude: ${lon}°`;

                // 2. Fetch live count of astronauts
                const astroResponse = await fetch('https://github.io');
                const astroData = await astroResponse.json();
                
                astroDisplay.innerHTML = `${astroData.number} Astronauts`;
                
            } catch (error) {
                coordsDisplay.innerText = "Error contacting satellite stream.";
                astroDisplay.innerText = "Offline.";
                console.error("API Fetch Failed:", error);
            }
        }

        // Run automatically when the webpage loads
        fetchSpaceData();

        // Manual refresh call triggers
        refreshBtn.addEventListener('click', fetchSpaceData);
    </script>
</body>
</html>
